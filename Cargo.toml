[workspace]
members = ["packages/eorzea-app", "packages/eorzea-auth", "packages/eorzea-cli"]
# 默认成员 = CLI：`cargo run` / `cargo check` 不再连带编译 dioxus/blitz。
# GUI：`cargo run -p eorzea-app`。
default-members = ["packages/eorzea-cli"]

[package]
name = "eorzea"
version = "0.1.0"
description = "FFXIV 国服启动器核心库（认证、游戏文件、启动编排）"
authors = ["azurice"]
edition = "2024"

[lib]
name = "eorzea_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eorzea-auth = { path = "packages/eorzea-auth" }
thiserror = "2"
# wasm 安全的 tokio 子集；原生目标在下方 target 段补 "full"（net→mio 不支持 wasm）
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["rustls-tls", "gzip"], default-features = false }
dirs = "5"
tracing = "0.1"
sha1 = "0.10"
flate2 = "1"
base64 = "0.22"
toml = "0.8"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
# release 本体（.7z）纯 Rust 解压：LZMA2/BCJ/COPY/DELTA 内置，ppmd/deflate 可选。
# 关掉默认 feature：aes256 会拉 getrandom 0.4，wasm32 目标下需要额外 backend 配置；
# 本项目不需要解密归档。compress/util 仅测试与工具用（见 dev-dependencies）。
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["ppmd", "deflate"] }

[dev-dependencies]
rpassword = "7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# 测试里用 ArchiveWriter 造 7z fixture（与上游同为 LZMA2），主依赖不需要 compress
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["compress"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "sdo_launch"
path = "examples/sdo_launch.rs"
required-features = ["eorzea-auth/sdo"]

# `cargo run`（dev profile）下载补丁时也会做大文件 SHA1。debug 下 SHA1
# 可能只有几十 MB/s，会把 1.4 GiB 补丁的校验拖到几分钟；只让 SHA1
# 依赖开优化，不影响项目自身 debug 编译速度。
[profile.dev.package.sha1]
opt-level = 3
