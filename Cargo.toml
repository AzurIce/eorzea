[workspace]
members = ["packages/eorzea-auth", "packages/eorzea-cli"]

[package]
name = "eorzea"
version = "0.1.0"
description = "FFXIV 国服启动器（Rust + dioxus-native GUI）"
authors = ["you"]
edition = "2021"
default-run = "eorzea"

[lib]
name = "eorzea_lib"

[dependencies]
dioxus = "0.7"
dioxus-native = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eorzea-auth = { path = "packages/eorzea-auth" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rpassword = "7"
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
flate2 = "1"
base64 = "0.22"
toml = "0.8"
md5 = "0.7"

[[example]]
name = "sdo_launch"
path = "examples/sdo_launch.rs"
required-features = ["eorzea-auth/sdo"]
