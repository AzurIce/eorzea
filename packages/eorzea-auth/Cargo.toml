[package]
name = "eorzea-auth"
version = "0.1.0"
edition = "2021"

[features]
default = ["sdo"]
sdo = []
se = ["regex"]

[dependencies]
# default-features=false：reqwest 默认拉 native-tls（不支持 wasm32），
# 显式 rustls-tls 供原生构建使用；wasm 构建走浏览器 fetch
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
regex = { version = "1", optional = true }
# wasm 安全的 tokio 子集（full 的 net→mio 不支持 wasm32）
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
base64 = "0.22"
byteorder = "1"
urlencoding = "2"
anyhow = "1"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rpassword = "7"
sys-info = "0.9"
whoami = "1"
num_cpus = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[example]]
name = "sdo_login"
path = "examples/sdo_login.rs"
required-features = ["sdo"]

[[example]]
name = "se_login"
path = "examples/se_login.rs"
required-features = ["se"]