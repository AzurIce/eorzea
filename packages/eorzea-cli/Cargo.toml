[package]
name = "eorzea-cli"
version = "0.1.0"
edition = "2021"
description = "Eorzea（FFXIV 国服启动器）命令行工具"

[[bin]]
name = "eoz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
rpassword = "7"
toml = "0.8"
tracing-subscriber = "0.3"
eorzea = { path = "../.." }
eorzea-auth = { path = "../eorzea-auth" }
